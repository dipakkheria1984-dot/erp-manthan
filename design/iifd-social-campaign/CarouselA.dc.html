<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..900;1,6..96,400..900&display=swap">
  <style>
    body { margin: 0; background: #F4EFE7; font-family: 'Archivo','Helvetica Neue',Helvetica,Arial,sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: #ED1C24; text-decoration: none; }
    a:hover { color: #B01018; }
    .disp { font-family: 'Bodoni Moda','Didot','Bodoni MT',Georgia,serif; }
    .lbl { font-size: 19px; font-weight: 600; letter-spacing: 0.18em; text-transform: uppercase; }
  </style>
</helmet>
<div style="width: 1080px; height: 1350px; background: #F4EFE7; color: #16110F; display: flex; flex-direction: column; overflow: hidden;">

  <div style="padding: 60px 64px 0;">
    <div style="display: flex; justify-content: space-between; align-items: baseline;">
      <span class="lbl" style="color: {{accent}};">01 / 03</span>
      <span class="lbl" style="color: rgba(22,17,15,0.45);">IIFD Kolkata</span>
    </div>
    <div style="display: flex; align-items: center; gap: 12px; margin-top: 20px;">
      <div style="flex-grow: 1; height: 1px; background: rgba(22,17,15,0.22);"></div>
      <div style="width: 8px; height: 8px; background: {{accent2}}; transform: rotate(45deg);"></div>
      <div style="flex-grow: 1; height: 1px; background: rgba(22,17,15,0.22);"></div>
    </div>
  </div>

  <div style="padding: 58px 64px 0;">
    <h1 class="disp" style="margin: 0; font-size: 106px; line-height: 0.94; font-weight: 700; letter-spacing: -0.025em;">Kolkata already<br>makes things.<br><span style="color: {{accent}};">Come and learn<br>how.</span></h1>
  </div>

  <div style="flex-grow: 1;"></div>

  <div style="padding: 0 64px 60px; display: flex; align-items: flex-end; gap: 44px;">
    <div style="flex-grow: 1; min-width: 0;">
      <div style="width: 88px; height: 5px; background: {{accent2}}; margin-bottom: 30px;"></div>
      <p style="margin: 0; font-size: 28px; line-height: 1.55; color: rgba(22,17,15,0.76); text-wrap: pretty;">Clay in Kumartuli. Jamdani on the loom. Bolts of cloth in Burrabazar. Hand-painted signboards on Park Street. The biggest design studio in Kolkata is Kolkata — and you already live in it.</p>
      <div style="display: flex; justify-content: space-between; align-items: center; border-top: 1px solid rgba(22,17,15,0.2); padding-top: 24px; margin-top: 38px;">
        <span class="disp" style="font-size: 28px; font-style: italic; color: rgba(22,17,15,0.6);">Cut from Kolkata</span>
        <span class="lbl" style="font-weight: 700; color: {{accent}};">Swipe →</span>
      </div>
    </div>
    <img src="ajrakh.jpg" alt="Printed drape on the runway" style="width: 340px; height: 470px; flex-shrink: 0; object-fit: cover; object-position: 50% 38%; border-radius: 170px 170px 0 0; display: block;">
  </div>

</div>
</x-dc>
<script data-dc-script data-props='{"accent":{"editor":"color","default":"#ED1C24","options":["#ED1C24","#B01018","#0F5C4A","#1B3A8F"],"section":"Campaign"},"accent2":{"editor":"color","default":"#E8A317","options":["#E8A317","#F5B301","#C9761E","#D4AF37"],"section":"Campaign"},"$preview":{"width":1080,"height":1350}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      accent: this.props.accent ?? '#ED1C24',
      accent2: this.props.accent2 ?? '#E8A317'
    };
  }
}
</script>
</body>
</html>
